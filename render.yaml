services:
  - type: web
    name: codenote-attendance-v3
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: codenote-attendance-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: AUTH_SERVER_URL
        sync: false
      - key: FIREBASE_CREDENTIALS
        sync: false
databases:
  - name: codenote-attendance-db
